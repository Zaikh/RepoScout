<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Random Repository Finder</title>
  <link rel="icon" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<text y='0.9em' font-size='90'>🔍</text>
</svg>">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="app">
  <h1>GitHub Random Repository Finder</h1>

  <div class="controls">
    <select id="languageSelect">
      <option value="">Select Language</option>
      <option value="javascript">JavaScript</option>
      <option value="python">Python</option>
      <option value="java">Java</option>
      <option value="c">C</option>
      <option value="c++">C++</option>
      <option value="php">PHP</option>
      <option value="typescript">TypeScript</option>
      <option value="go">Go</option>
      <option value="rust">Rust</option>
      <option value="ruby">Ruby</option>
      <option value="swift">Swift</option>
      <option value="kotlin">Kotlin</option>
      <option value="c#">C#</option>
    </select>

    <select id="topicSelect">
      <option value="">Select Topic</option>
      <option value="web development">Web Development</option>
      <option value="machine learning">AI / Machine Learning</option>
      <option value="data science">Data Science</option>
      <option value="mobile app">Mobile App Development</option>
      <option value="blockchain">Blockchain</option>
      <option value="devops">DevOps</option>
      <option value="game">Game Development</option>
    </select>

    <button id="fetchBtn">Find Repo</button>
  </div>

  <div id="state" class="state"></div>

  <section id="repoCard" class="repo hidden">
    <h2 id="repoName"></h2>
    <p id="repoDesc"></p>

    <div class="stats">
      <span>⭐ <strong id="stars"></strong></span>
      <span>🍴 <strong id="forks"></strong></span>
      <span>🐞 <strong id="issues"></strong></span>
    </div>

    <a id="repoLink" target="_blank">View on GitHub</a>
    <button id="refreshBtn">Get Another</button>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
